<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>六一儿童节，你要给我买旺仔牛奶吗</title>
  <style>
    * { box-sizing: border-box; font: inherit; }
    html { color: #333; font-size: 62.5%; }
    @media screen and (max-width: 480px) { html { font-size: 50%; } }
    body {
      font-size: 2.4rem;
      padding: 0;
      margin: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: Rubik, Arial, "Microsoft YaHei", sans-serif;
      background: linear-gradient(160deg, #fff5f8 0%, #ffe8f0 45%, #fff9e6 100%);
    }
    .accepted, .confirm, .rejected {
      position: absolute;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 72rem;
      max-width: 100vw;
      min-width: 0;
      max-height: 100%;
      height: 46rem;
      background-color: #fff;
      border-radius: 1rem;
      box-shadow: 0 8px 32px rgba(255, 105, 135, 0.15);
    }
    .accepted-body, .confirm-body, .rejected-body {
      flex: 1;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      position: relative;
      margin: 2rem 4rem;
    }
    .accepted-body-title, .confirm-body-title, .rejected-body-title {
      position: absolute;
      top: 1.8rem;
      left: 0;
      right: 0;
      width: 100%;
      margin: 0 auto;
      padding: 0 1.2rem;
      text-align: center;
      line-height: 1.35;
      font-size: clamp(2rem, 5.2vw, 2.8rem);
      font-weight: 400;
      color: #333;
      word-break: break-all;
      overflow-wrap: anywhere;
      z-index: 5;
    }
    .accepted-body-subtitle, .confirm-body-subtitle, .rejected-body-subtitle {
      position: absolute;
      top: 9.2rem;
      left: 0;
      right: 0;
      width: 100%;
      margin: 0 auto;
      padding: 0 1.2rem;
      text-align: center;
      line-height: 1.35;
      font-size: clamp(1.7rem, 4.2vw, 2.1rem);
      font-weight: 400;
      color: #666;
      word-break: break-all;
      overflow-wrap: anywhere;
      z-index: 5;
    }
    .confirm-body-button {
      color: #fff;
      border-radius: 1rem;
      text-decoration: none;
      padding: 1rem 2rem;
      margin-bottom: 1rem;
      min-width: 10rem;
      text-align: center;
      transition: background-color .3s, transform .2s;
      position: relative;
      z-index: 10;
      cursor: pointer;
      border: none;
      font-size: 2.5rem;
    }
    .confirm-body-button-delete {
      background-color: #e85d5d;
      margin-right: 10%;
    }
    .confirm-body-button-delete:hover { background-color: #f07070; }
    .confirm-body-button-cancel {
      background-color: #6a4;
      margin-left: 10%;
      transform-origin: left;
    }
    .confirm-body-button-cancel:hover { background-color: #81c061; }
    .boi {
      --happiness: 0.9;
      --derp: 1;
      --px: 0.5;
      --py: 0.5;
      width: 22rem;
      max-width: 100%;
      height: 22rem;
      top: 54%;
      left: 50%;
      transform: translate(-50%, -50%);
      background-image: radial-gradient(#f7e0b2, #eb5);
      border-radius: 100%;
      overflow: hidden;
      margin: 0;
      align-self: center;
      flex: 0 0 auto;
      border: solid 2px #ecb23e;
      box-shadow: 0 0 5px rgba(0, 0, 0, .2);
      z-index: 2;
    }
    .boi, .boi * { position: absolute; }
    .boi::before {
      content: '';
      display: block;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      background-image: linear-gradient(to bottom, #5a8, rgba(85, 170, 136, 0));
      opacity: calc(1 - var(--happiness));
    }
    .boi-blush {
      width: 20%;
      height: 10%;
      background-color: rgba(255, 100, 100, .3);
      border: 3px solid rgba(255, 100, 100, .3);
      top: calc(45% + var(--py) * 10%);
      border-radius: 100%;
      opacity: calc(var(--happiness) * var(--happiness) * .9 + .1);
    }
    .boi-blush-left { left: calc(7% + var(--px) * 2%); }
    .boi-blush-right { right: calc(9% - var(--px) * 2%); }
    .boi-eye {
      width: calc(26% - var(--happiness) * 2%);
      height: calc(26% - var(--happiness) * 2%);
      background-color: #f6f6f6;
      border-radius: 100%;
      top: calc(25% + var(--py) * 10%);
      overflow: hidden;
    }
    .boi-eye-left { left: calc(18% + var(--px) * 4%); }
    .boi-eye-right { right: calc(22% - var(--px) * 4%); }
    .boi-eye-left::after {
      transform: translate(
        calc((var(--px) + var(--derp) * .5) * 100%),
        calc((var(--py) + var(--derp) * .5) * 100%)
      );
    }
    .boi-eye-right::after {
      transform: translate(
        calc((var(--px) + var(--derp) * -.3) * 100%),
        calc((var(--py) + var(--derp) * -.3) * 100%)
      );
    }
    .boi-eye::after {
      content: '';
      display: block;
      background-color: #421;
      width: calc(55% - var(--happiness) * 10%);
      height: calc(55% - var(--happiness) * 10%);
      border-radius: 100%;
    }
    .boi-mouth {
      width: calc(51% - var(--happiness) * 2%);
      height: calc(26% - var(--happiness) * 2%);
      background-color: #a33;
      border-radius:
        calc((1 - var(--happiness)) * 10em)
        calc((1 - var(--happiness)) * 10em)
        calc(var(--happiness) * 16em)
        calc(var(--happiness) * 16em);
      top: calc(57.5% + var(--py) * 5%);
      left: calc(47.5% + var(--px) * 5%);
      transform: translateX(-50%);
      overflow: hidden;
      border: 3px solid #962d2d;
    }
    .boi-mouth::before {
      content: '';
      display: block;
      position: absolute;
      width: 20%;
      height: 20%;
      top: 0;
      left: 50%;
      background-color: #fff;
      border-radius: 0 0 .5rem .5rem;
    }
    .boi-mouth::after {
      content: '';
      display: block;
      position: absolute;
      width: 60%;
      height: 50%;
      left: 10%;
      bottom: 0;
      background-color: rgba(0, 0, 0, .2);
      border-radius: 20rem 20rem 0 0;
    }
    .hidden { display: none !important; }
    .page-badge {
      position: fixed;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 105, 135, 0.9);
      color: #fff;
      font-size: 1.4rem;
      padding: 0.4rem 1.2rem;
      border-radius: 2rem;
      z-index: 100;
      letter-spacing: 0.05em;
    }
    @media screen and (max-width: 600px) {
      .accepted, .confirm, .rejected {
        width: 100vw;
        max-width: 100vw;
        border-radius: .8rem;
      }
      .accepted-body, .confirm-body, .rejected-body { margin: 2rem 2.2rem; }
      .confirm-body-button { font-size: 2.5rem; }
    }
  </style>
</head>
<body>
  <div class="page-badge">🎈 六一儿童节 🥛</div>

  <section class="confirm" id="confirmSection">
    <div class="confirm-body">
      <h2 class="confirm-body-title">六一儿童节，你要给我买旺仔牛奶吗</h2>
      <h3 class="confirm-body-subtitle">爱你哟~❤️</h3>
      <figure class="boi" id="confirmBoi" style="--happiness:0.9; --derp:1; --px:0.5; --py:0.5;">
        <div class="boi-blush boi-blush-left"></div>
        <div class="boi-blush boi-blush-right"></div>
        <div class="boi-eye boi-eye-left"></div>
        <div class="boi-eye boi-eye-right"></div>
        <div class="boi-mouth"></div>
      </figure>
      <button type="button" class="confirm-body-button confirm-body-button-cancel" id="btnAccept">接受</button>
      <button type="button" class="confirm-body-button confirm-body-button-delete" id="btnReject">拒绝</button>
    </div>
  </section>

  <section class="accepted hidden" id="acceptedSection">
    <div class="accepted-body">
      <h2 class="accepted-body-title">谢谢宝宝~</h2>
      <h3 class="accepted-body-subtitle">我要永远做的你的小朋友！</h3>
      <figure class="boi" style="--happiness:1; --derp:0; --px:0.5; --py:0.5;">
        <div class="boi-blush boi-blush-left"></div>
        <div class="boi-blush boi-blush-right"></div>
        <div class="boi-eye boi-eye-left"></div>
        <div class="boi-eye boi-eye-right"></div>
        <div class="boi-mouth"></div>
      </figure>
    </div>
  </section>

  <section class="rejected hidden" id="rejectedSection">
    <div class="rejected-body">
      <h2 class="rejected-body-title">Hello World</h2>
      <h3 class="rejected-body-subtitle">但尊重你的决定，祝你一切顺利！</h3>
      <figure class="boi" style="--happiness:0.2; --derp:0; --px:0.5; --py:0.5;">
        <div class="boi-blush boi-blush-left"></div>
        <div class="boi-blush boi-blush-right"></div>
        <div class="boi-eye boi-eye-left"></div>
        <div class="boi-eye boi-eye-right"></div>
        <div class="boi-mouth"></div>
      </figure>
    </div>
  </section>

  <script>
    (function () {
      var confirmSection = document.getElementById('confirmSection');
      var acceptedSection = document.getElementById('acceptedSection');
      var rejectedSection = document.getElementById('rejectedSection');
      var btnAccept = document.getElementById('btnAccept');
      var btnReject = document.getElementById('btnReject');
      var boi = document.getElementById('confirmBoi');

      var current = { happiness: 0.9, derp: 1, px: 0.5, py: 0.5 };
      var target = { happiness: 0.9, derp: 1, px: 0.5, py: 0.5 };

      function updateBoi() {
        if (!boi) return;
        for (var prop in target) {
          if (target[prop] === current[prop]) continue;
          if (Math.abs(target[prop] - current[prop]) < 0.01) {
            current[prop] = target[prop];
          } else {
            current[prop] += (target[prop] - current[prop]) * 0.1;
          }
          boi.style.setProperty('--' + prop, current[prop]);
        }
        requestAnimationFrame(updateBoi);
      }
      updateBoi();

      confirmSection.addEventListener('mousemove', function (e) {
        var rect = confirmSection.getBoundingClientRect();
        target.px = (e.clientX - rect.x) / rect.width;
        target.py = (e.clientY - rect.y) / rect.height;
        target.derp = 0;
      });

      confirmSection.addEventListener('mouseleave', function () {
        target.happiness = 0.9;
        target.derp = 1;
        target.px = 0.5;
        target.py = 0.5;
      });

      btnAccept.addEventListener('click', function () {
        confirmSection.classList.add('hidden');
        acceptedSection.classList.remove('hidden');
        target.happiness = 1;
      });

      btnReject.addEventListener('click', function () {
        confirmSection.classList.add('hidden');
        rejectedSection.classList.remove('hidden');
      });
    })();
  </script>
</body>
</html>
