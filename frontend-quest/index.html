<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>前端冒险 · Code Quest</title>
  <style>
    :root {
      --bg: #0d1117;
      --panel: #161b22;
      --panel2: #21262d;
      --border: #30363d;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #58a6ff;
      --gold: #f0c14b;
      --hp: #f85149;
      --mp: #a371f7;
      --ok: #3fb950;
      --warn: #d29922;
      --font: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }
    .screen { display: none; min-height: 100vh; }
    .screen.active { display: flex; flex-direction: column; }

    /* ── 启动页 ── */
    #screen-start {
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(ellipse at 30% 20%, rgba(88,166,255,.12), transparent 50%),
        radial-gradient(ellipse at 70% 80%, rgba(163,113,247,.1), transparent 50%),
        var(--bg);
      text-align: center;
      padding: 24px;
    }
    .logo { font-size: 3rem; margin-bottom: 8px; }
    .title { font-size: 2rem; font-weight: 700; margin-bottom: 8px; }
    .subtitle { color: var(--muted); max-width: 480px; line-height: 1.6; margin-bottom: 32px; }
    .btn {
      display: inline-block;
      padding: 12px 28px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--panel2);
      color: var(--text);
      font-size: 15px;
      cursor: pointer;
      transition: .15s;
      font-family: inherit;
    }
    .btn:hover { border-color: var(--accent); transform: translateY(-1px); }
    .btn-primary {
      background: linear-gradient(135deg, #238636, #2ea043);
      border-color: #238636;
      color: #fff;
      font-weight: 600;
    }
    .btn-primary:hover { border-color: var(--ok); }
    .start-stats { margin-top: 24px; font-size: 13px; color: var(--muted); }

    /* ── 顶栏 ── */
    .topbar {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 12px 20px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
    }
    .topbar h1 { font-size: 1rem; flex: 1; }
    .stat-bar { display: flex; gap: 12px; align-items: center; font-size: 13px; }
    .stat-bar span { color: var(--muted); }
    .xp-bar-wrap {
      width: 120px; height: 8px;
      background: var(--panel2);
      border-radius: 4px;
      overflow: hidden;
    }
    .xp-bar { height: 100%; background: linear-gradient(90deg, var(--accent), var(--mp)); transition: width .4s; }

    /* ── 地图 ── */
    #screen-map { flex: 1; }
    .map-body {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
    }
    .region {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      margin-bottom: 16px;
      overflow: hidden;
    }
    .region-head {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 18px;
      cursor: pointer;
      user-select: none;
    }
    .region-head:hover { background: var(--panel2); }
    .region-icon { font-size: 1.8rem; }
    .region-info { flex: 1; }
    .region-info h2 { font-size: 1rem; margin-bottom: 2px; }
    .region-info p { font-size: 12px; color: var(--muted); }
    .region-progress {
      font-size: 12px;
      color: var(--accent);
      font-weight: 600;
    }
    .region.locked { opacity: .45; pointer-events: none; }
    .region.locked .region-head { cursor: not-allowed; }
    .levels { display: none; padding: 0 12px 12px; flex-wrap: wrap; gap: 8px; }
    .region.open .levels { display: flex; }
    .level-btn {
      width: calc(20% - 7px);
      min-width: 64px;
      aspect-ratio: 1;
      border-radius: 10px;
      border: 2px solid var(--border);
      background: var(--panel2);
      color: var(--text);
      cursor: pointer;
      font-size: 13px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: .15s;
      font-family: inherit;
    }
    .level-btn:hover:not(:disabled) { border-color: var(--accent); transform: scale(1.05); }
    .level-btn.done { border-color: var(--ok); background: rgba(63,185,80,.12); }
    .level-btn.current { border-color: var(--gold); box-shadow: 0 0 12px rgba(240,193,75,.3); }
    .level-btn:disabled { opacity: .35; cursor: not-allowed; }
    .level-btn .num { font-weight: 700; font-size: 16px; }
    .level-btn.boss { border-color: var(--hp); }
    .level-btn.boss.done { border-color: var(--ok); }

    /* ── 战斗/答题 ── */
    #screen-battle { flex: 1; }
    .battle-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      max-width: 720px;
      margin: 0 auto;
      width: 100%;
      padding: 20px;
    }
    .enemy-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 16px;
      text-align: center;
    }
    .enemy-sprite { font-size: 4rem; margin-bottom: 8px; animation: float 2s ease-in-out infinite; }
    @keyframes float { 0%,100%{ transform: translateY(0); } 50%{ transform: translateY(-8px); } }
    .enemy-name { font-size: 1.1rem; font-weight: 600; color: var(--hp); }
    .enemy-hp-bar {
      height: 10px;
      background: var(--panel2);
      border-radius: 5px;
      margin-top: 10px;
      overflow: hidden;
    }
    .enemy-hp-fill {
      height: 100%;
      background: var(--hp);
      transition: width .5s;
    }
    .lesson-card {
      background: var(--panel);
      border-left: 3px solid var(--accent);
      border-radius: 0 8px 8px 0;
      padding: 14px 16px;
      margin-bottom: 16px;
      font-size: 14px;
      line-height: 1.7;
    }
    .lesson-card code {
      background: var(--panel2);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 13px;
      color: var(--gold);
    }
    .question-box {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      flex: 1;
    }
    .question-box h3 { margin-bottom: 12px; font-size: 1rem; }
    .code-block {
      background: #0d1117;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 16px;
      font-family: "Cascadia Code", "Consolas", monospace;
      font-size: 13px;
      line-height: 1.6;
      margin: 12px 0;
      overflow-x: auto;
      white-space: pre;
      color: #79c0ff;
    }
    .options { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
    .opt-btn {
      text-align: left;
      padding: 12px 16px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--panel2);
      color: var(--text);
      cursor: pointer;
      font-size: 14px;
      transition: .12s;
      font-family: inherit;
    }
    .opt-btn:hover:not(:disabled) { border-color: var(--accent); }
    .opt-btn.correct { border-color: var(--ok); background: rgba(63,185,80,.15); }
    .opt-btn.wrong { border-color: var(--hp); background: rgba(248,81,73,.12); }
    .opt-btn:disabled { cursor: default; }
    .feedback {
      margin-top: 12px;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 14px;
      display: none;
    }
    .feedback.show { display: block; }
    .feedback.ok { background: rgba(63,185,80,.15); border: 1px solid var(--ok); }
    .feedback.err { background: rgba(248,81,73,.12); border: 1px solid var(--hp); }
    .battle-footer {
      display: flex;
      gap: 10px;
      margin-top: 16px;
      justify-content: flex-end;
    }

    /* ── 代码填空 ── */
    .fill-wrap { margin-top: 12px; }
    .fill-code {
      background: #0d1117;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px 16px;
      font-family: "Cascadia Code", "Consolas", monospace;
      font-size: 13px;
      line-height: 2;
      overflow-x: auto;
    }
    .fill-line { white-space: pre; }
    .fill-input {
      display: inline-block;
      min-width: 72px;
      max-width: 160px;
      padding: 2px 8px;
      margin: 0 2px;
      border: none;
      border-bottom: 2px solid var(--gold);
      background: rgba(240,193,75,.08);
      color: var(--gold);
      font-family: inherit;
      font-size: 13px;
      outline: none;
      vertical-align: baseline;
    }
    .fill-input:focus { background: rgba(240,193,75,.18); }
    .fill-input.wrong {
      border-bottom-color: var(--hp);
      background: rgba(248,81,73,.12);
      animation: shake .35s;
    }
    .fill-input.correct {
      border-bottom-color: var(--ok);
      background: rgba(63,185,80,.12);
    }
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      25% { transform: translateX(-4px); }
      75% { transform: translateX(4px); }
    }
    .fill-actions { margin-top: 14px; display: flex; gap: 10px; align-items: center; }
    .q-type-tag {
      display: inline-block;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 4px;
      background: rgba(163,113,247,.2);
      color: var(--mp);
      margin-left: 8px;
      font-weight: normal;
    }
    .q-type-tag.choice { background: rgba(88,166,255,.15); color: var(--accent); }

    /* ── 学习课堂 ── */
    #screen-study { flex: 1; }
    .study-body {
      flex: 1;
      max-width: 760px;
      margin: 0 auto;
      width: 100%;
      padding: 20px 20px 32px;
      overflow-y: auto;
    }
    .study-hero {
      background: linear-gradient(135deg, rgba(88,166,255,.12), rgba(163,113,247,.08));
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px 22px;
      margin-bottom: 16px;
    }
    .study-hero h2 { font-size: 1.25rem; margin-bottom: 6px; }
    .study-hero p { color: var(--muted); font-size: 14px; line-height: 1.6; }
    .study-section {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px 20px;
      margin-bottom: 12px;
    }
    .study-section h3 {
      font-size: .95rem;
      color: var(--accent);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .study-section p, .study-section li {
      font-size: 14px;
      line-height: 1.75;
      color: var(--text);
    }
    .study-section ul { padding-left: 20px; margin-top: 6px; }
    .study-section li { margin-bottom: 4px; }
    .study-section code {
      background: var(--panel2);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 13px;
      color: var(--gold);
    }
    .study-example {
      background: #0d1117;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px 16px;
      font-family: "Cascadia Code", "Consolas", monospace;
      font-size: 13px;
      line-height: 1.65;
      overflow-x: auto;
      white-space: pre;
      color: #79c0ff;
      margin-top: 10px;
    }
    .study-tip {
      background: rgba(240,193,75,.08);
      border-left: 3px solid var(--gold);
      padding: 10px 14px;
      border-radius: 0 8px 8px 0;
      font-size: 13px;
      line-height: 1.65;
      margin-top: 10px;
      color: var(--muted);
    }
    .study-tip strong { color: var(--gold); }
    .study-exam {
      background: rgba(63,185,80,.08);
      border: 1px solid rgba(63,185,80,.3);
      border-radius: 10px;
      padding: 14px 16px;
      margin-top: 4px;
    }
    .study-exam h3 { color: var(--ok); }
    .study-footer {
      display: flex;
      gap: 10px;
      justify-content: center;
      padding: 16px 20px 24px;
      border-top: 1px solid var(--border);
      background: var(--panel);
    }
    .study-steps {
      display: flex;
      gap: 8px;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .study-steps span {
      padding: 4px 10px;
      border-radius: 20px;
      background: var(--panel2);
      border: 1px solid var(--border);
    }
    .study-steps span.active {
      background: rgba(88,166,255,.15);
      border-color: var(--accent);
      color: var(--accent);
      font-weight: 600;
    }

    /* ── 胜利/通关 ── */
    .victory-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.75);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .victory-overlay.show { display: flex; }
    .victory-box {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 32px;
      text-align: center;
      max-width: 420px;
    }
    .victory-box .emoji { font-size: 3rem; margin-bottom: 12px; }
    .victory-box h2 { margin-bottom: 8px; }
    .victory-box p { color: var(--muted); margin-bottom: 20px; line-height: 1.6; }

    /* ── 进度报告 ── */
    .report-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 10px;
      margin: 16px 0;
    }
    .report-item {
      background: var(--panel2);
      border-radius: 8px;
      padding: 12px;
      text-align: center;
      font-size: 13px;
    }
    .report-item .val { font-size: 1.4rem; font-weight: 700; color: var(--accent); }

    @media (max-width: 600px) {
      .level-btn { width: calc(33% - 6px); }
      .title { font-size: 1.5rem; }
    }
  </style>
</head>
<body>

<!-- ═══ 启动页 ═══ -->
<div id="screen-start" class="screen active">
  <div class="logo">⚔️</div>
  <div class="title">前端冒险 · Code Quest</div>
  <p class="subtitle">
    网站世界被 Bug 军团入侵了！<br/>
    每击败一个 Bug，就掌握一项前端技能。<br/>
    <strong>26 关全通 = 前端核心知识毕业</strong><br/>
    <span style="font-size:14px;color:#8b949e">每关先学再练 · 含代码填空 · 答错须重答</span>
  </p>
  <button class="btn btn-primary" id="btn-start">开始冒险</button>
  <button class="btn" id="btn-continue" style="margin-left:8px;display:none">继续游戏</button>
  <p class="start-stats" id="start-stats"></p>
</div>

<!-- ═══ 世界地图 ═══ -->
<div id="screen-map" class="screen">
  <div class="topbar">
    <h1>🗺️ 世界地图</h1>
    <div class="stat-bar">
      <span>Lv.<strong id="player-lv">1</strong></span>
      <div class="xp-bar-wrap"><div class="xp-bar" id="xp-bar" style="width:0%"></div></div>
      <span id="xp-text">0 XP</span>
    </div>
    <button class="btn" id="btn-report">📊 学习报告</button>
    <button class="btn" id="btn-reset">重置进度</button>
  </div>
  <div class="map-body" id="map-container"></div>
</div>

<!-- ═══ 学习课堂（每关挑战前） ═══ -->
<div id="screen-study" class="screen">
  <div class="topbar">
    <button class="btn" id="btn-study-back">← 返回地图</button>
    <h1 id="study-title">学习课堂</h1>
  </div>
  <div class="study-body">
    <div class="study-steps">
      <span class="active">① 学习知识</span>
      <span>② 答题挑战</span>
      <span>③ 代码填空</span>
    </div>
    <div id="study-content"></div>
  </div>
  <div class="study-footer">
    <button class="btn" id="btn-review-later">稍后再学</button>
    <button class="btn btn-primary" id="btn-start-battle">我已学完，开始挑战 →</button>
  </div>
</div>

<!-- ═══ 战斗/答题 ═══ -->
<div id="screen-battle" class="screen">
  <div class="topbar">
    <button class="btn" id="btn-back-map">← 返回地图</button>
    <button class="btn" id="btn-back-study">📖 复习本关</button>
    <h1 id="battle-title">关卡</h1>
  </div>
  <div class="battle-body">
    <div class="enemy-card">
      <div class="enemy-sprite" id="enemy-sprite">🐛</div>
      <div class="enemy-name" id="enemy-name">未知 Bug</div>
      <div class="enemy-hp-bar"><div class="enemy-hp-fill" id="enemy-hp" style="width:100%"></div></div>
    </div>
    <div class="lesson-card" id="lesson-card"></div>
    <div class="question-box">
      <h3 id="question-text">题目</h3>
      <div id="code-display"></div>
      <div class="options" id="options"></div>
      <div class="fill-wrap" id="fill-wrap" style="display:none"></div>
      <div class="feedback" id="feedback"></div>
    </div>
    <div class="battle-footer">
      <button class="btn btn-primary" id="btn-submit-fill" style="display:none">提交答案</button>
      <button class="btn" id="btn-next-q" style="display:none">下一题 →</button>
    </div>
  </div>
</div>

<!-- ═══ 弹窗 ═══ -->
<div class="victory-overlay" id="overlay-victory">
  <div class="victory-box">
    <div class="emoji" id="victory-emoji">🎉</div>
    <h2 id="victory-title">关卡完成！</h2>
    <p id="victory-msg"></p>
    <button class="btn btn-primary" id="btn-victory-ok">继续</button>
  </div>
</div>

<div class="victory-overlay" id="overlay-report">
  <div class="victory-box" style="max-width:520px;text-align:left">
    <h2 style="text-align:center">📊 前端学习报告</h2>
    <div class="report-grid" id="report-grid"></div>
    <p id="report-detail" style="font-size:13px;color:var(--muted);line-height:1.7"></p>
    <div style="text-align:center;margin-top:16px">
      <button class="btn btn-primary" id="btn-report-close">关闭</button>
    </div>
  </div>
</div>

<script src="game.js"></script>

</body>
</html>
